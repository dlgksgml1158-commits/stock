name: 데이터 수집 (해외 업종/급등전/숏스퀴즈 + 국내 업종)

on:
  schedule:
    # GitHub Actions는 부하 상황에 따라 스케줄이 몇 시간씩(관측 사례로는 9~14시간까지)
    # 밀리는 경우가 있음 (다른 프로젝트에서 실제로 관측됨). 그래서 목표 시각마다
    # 2시간 간격 버퍼 cron을 3개씩 더 걸어둠 — 정시 실행이 성공하면
    # collect_sector_snapshot.py의 same-day 가드가 버퍼 실행을 그냥 스킵하고,
    # 정시 실행이 지연/실패하면 버퍼 중 하나가 그날 안에 대신 잡아준다.
    - cron: '35 13 * * 1-5'  # [해외] 미국 장 시작(~9:35am ET=22:35 KST) 정시, 평일만. DST 미보정.
    - cron: '35 15 * * 1-5'  # [해외] 장 시작 버퍼 +2h
    - cron: '35 17 * * 1-5'  # [해외] 장 시작 버퍼 +4h
    - cron: '35 19 * * 1-5'  # [해외] 장 시작 버퍼 +6h
    - cron: '3 15 * * *'     # [해외] 한국시간 00:03 정시, 매일
    - cron: '3 17 * * *'     # [해외] 자정 버퍼 +2h
    - cron: '3 19 * * *'     # [해외] 자정 버퍼 +4h
    - cron: '3 21 * * *'     # [해외] 자정 버퍼 +6h
    - cron: '3 0 * * 1-5'    # [국내] 한국 장 시작(09:03 KST) 정시, 평일만
    - cron: '3 2 * * 1-5'    # [국내] 장 시작 버퍼 +2h
    - cron: '3 4 * * 1-5'    # [국내] 장 시작 버퍼 +4h
    - cron: '3 6 * * 1-5'    # [국내] 장 시작 버퍼 +6h
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔄 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: pip install requests beautifulsoup4 lxml

      - name: 🏷 라벨 결정
        id: label
        run: |
          case "${{ github.event.schedule }}" in
            "35 13 * * 1-5" | "35 15 * * 1-5" | "35 17 * * 1-5" | "35 19 * * 1-5")
              echo "value=market_open" >> "$GITHUB_OUTPUT" ;;
            "3 15 * * *" | "3 17 * * *" | "3 19 * * *" | "3 21 * * *")
              echo "value=midnight_kst" >> "$GITHUB_OUTPUT" ;;
            "3 0 * * 1-5" | "3 2 * * 1-5" | "3 4 * * 1-5" | "3 6 * * 1-5")
              echo "value=kr_market_open" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "value=manual" >> "$GITHUB_OUTPUT" ;;
          esac

      # 해외(미국) 3종 — market_open/midnight_kst/manual 트리거에서만 실행.
      # kr_market_open 트리거(한국 장 시작 전용)에서는 건너뛴다.
      - name: 📊 업종 스냅샷 수집
        if: ${{ steps.label.outputs.value != 'kr_market_open' }}
        run: python scripts/collect_sector_snapshot.py --label "${{ steps.label.outputs.value }}"

      - name: ⏳ Finviz 레이트리밋 방지 대기
        if: ${{ steps.label.outputs.value != 'kr_market_open' }}
        run: sleep 30

      - name: 🚀 급등 전 후보 수집
        if: ${{ steps.label.outputs.value != 'kr_market_open' }}
        run: python scripts/collect_presurge_screener.py --label "${{ steps.label.outputs.value }}"

      - name: ⏳ Finviz 레이트리밋 방지 대기
        if: ${{ steps.label.outputs.value != 'kr_market_open' }}
        run: sleep 30

      - name: 🩳 숏스퀴즈 후보 수집
        if: ${{ steps.label.outputs.value != 'kr_market_open' }}
        run: python scripts/collect_shortsqueeze_screener.py --label "${{ steps.label.outputs.value }}"

      # 국내 — kr_market_open/manual 트리거에서만 실행. market_open/midnight_kst에서는 건너뛴다.
      - name: 🇰🇷 국내 업종 스냅샷 수집
        if: ${{ steps.label.outputs.value == 'kr_market_open' || steps.label.outputs.value == 'manual' }}
        run: python scripts/collect_kr_sector_snapshot.py --label "${{ steps.label.outputs.value }}"

      - name: 💾 변경사항 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "섹터 봇"
          git add data/sector_history.json data/presurge_history.json data/shortsqueeze_history.json data/kr_sector_history.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 스킵"
          else
            TIMESTAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "📊 업종 스냅샷 갱신 (${{ steps.label.outputs.value }}): $TIMESTAMP"
            git pull --rebase origin main
            git push
            echo "✅ 커밋 완료"
          fi
