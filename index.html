<meta charset="utf-8" />
<title>주식</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="google" content="notranslate" />
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --gridline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.1);
    --delta-good: #006300;
    --delta-bad: #d03b3b;
    --row-hover: #f2f1ed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --gridline: #2c2c2a;
      --border: rgba(255, 255, 255, 0.1);
      --delta-good: #0ca30c;
      --delta-bad: #e66767;
      --row-hover: #232322;
    }
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --gridline: #2c2c2a;
    --border: rgba(255, 255, 255, 0.1);
    --delta-good: #0ca30c;
    --delta-bad: #e66767;
    --row-hover: #232322;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  header h1 {
    font-size: 1.35rem;
    margin: 0 0 4px;
  }
  header p {
    color: var(--text-secondary);
    margin: 0 0 16px;
    font-size: 0.9rem;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  select {
    font: inherit;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
  }
  .updated {
    font-size: 0.82rem;
    color: var(--muted);
  }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 10px;
  }
  .card h2 .hint {
    font-weight: 400;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 18px;
    align-items: start;
    margin-bottom: 18px;
  }
  .grid-2 > .card { margin-bottom: 0; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
  }
  .stat-tile .label {
    font-size: 0.74rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 7px;
  }
  .stat-main {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .stat-name {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.25;
  }
  .stat-delta {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    white-space: nowrap;
  }
  .stat-tile .sub {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  th, td {
    text-align: left;
    padding: 7px 8px;
    border-bottom: 1px solid var(--gridline);
    white-space: nowrap;
  }
  th {
    color: var(--muted);
    font-weight: 500;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  tr:hover td { background: var(--row-hover); }
  td.name { white-space: normal; max-width: 220px; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  .delta-up { color: var(--delta-good); font-weight: 600; }
  .delta-down { color: var(--delta-bad); font-weight: 600; }
  .empty {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 30px 0;
    text-align: center;
  }
  footer {
    color: var(--muted);
    font-size: 0.78rem;
    text-align: center;
    margin-top: 24px;
  }
  footer a { color: inherit; }
</style>

<div class="wrap" translate="no">
  <header>
    <h1>🇺🇸 주식</h1>
    <p>Finviz 업종(~140개) 당일 등락률 기준. 자동 수집 — 하루 2회(미국 장 시작 / 한국시간 자정).</p>
  </header>

  <div class="controls">
    <select id="snapshot-picker"></select>
    <span class="updated" id="updated-label"></span>
  </div>

  <div id="content"></div>

  <footer>
    데이터: <a href="https://finviz.com/groups.ashx?g=industry&v=152" target="_blank" rel="noopener">Finviz</a>
    · <a href="https://github.com/dlgksgml1158-commits/stock" target="_blank" rel="noopener">소스</a>
  </footer>
</div>

<script>
  const LABEL_KR = { market_open: "미국 장 시작", midnight_kst: "한국시간 자정", manual: "수동 실행" };

  function fmtPct(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return "-";
    const sign = v > 0 ? "+" : "";
    return `${sign}${v.toFixed(2)}%`;
  }

  function deltaClass(v) {
    if (v > 0) return "delta-up";
    if (v < 0) return "delta-down";
    return "";
  }

  function fmtVolRatio(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return "-";
    return `${v.toFixed(2)}x`;
  }

  function fmtMarketCap(v) {
    if (!v) return "-";
    return `${(v / 1e9).toLocaleString(undefined, { maximumFractionDigits: 0 })}B`;
  }

  function fmtTimestamp(iso) {
    const d = new Date(iso);
    return d.toLocaleString("ko-KR", {
      timeZone: "Asia/Seoul",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
    }) + " KST";
  }

  function rankTable(rows, title, hint) {
    const trs = rows
      .map(
        (r) => `
      <tr>
        <td class="name">${r.name}</td>
        <td class="num ${deltaClass(r.change_pct)}">${fmtPct(r.change_pct)}</td>
        <td class="num">${fmtVolRatio(r.volume_ratio)}</td>
        <td class="num">${fmtMarketCap(r.market_cap)}</td>
        <td class="num">${r.stocks ?? "-"}</td>
      </tr>`
      )
      .join("");
    return `
      <div class="card">
        <h2>${title} <span class="hint">${hint}</span></h2>
        <table>
          <thead>
            <tr><th>업종</th><th>등락률</th><th>거래량비율</th><th>시총</th><th>종목수</th></tr>
          </thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  function streakTable(history, latestIndustries) {
    // 최신 스냅샷 TOP10에 있는 업종이, 그 직전 스냅샷들에서도 연속으로 TOP10이었는지 센다.
    const top10Names = new Set(
      [...latestIndustries].sort((a, b) => b.change_pct - a.change_pct).slice(0, 10).map((r) => r.name)
    );
    const streaks = {};
    for (const name of top10Names) streaks[name] = 0;

    for (let i = history.length - 1; i >= 0; i--) {
      const top10 = new Set(
        [...history[i].industries].sort((a, b) => b.change_pct - a.change_pct).slice(0, 10).map((r) => r.name)
      );
      let anyContinuing = false;
      for (const name of top10Names) {
        if (streaks[name] === history.length - 1 - i && top10.has(name)) {
          streaks[name]++;
          anyContinuing = true;
        }
      }
      if (!anyContinuing) break;
    }

    const rows = Object.entries(streaks)
      .filter(([, streak]) => streak >= 2)
      .sort((a, b) => b[1] - a[1]);

    if (rows.length === 0) {
      return `
        <div class="card">
          <h2>연속 상위권 업종 <span class="hint">최근 스냅샷 기준 2회 이상 연속 TOP10</span></h2>
          <p class="empty">아직 연속으로 강세인 업종이 없습니다 (히스토리가 더 쌓이면 나타납니다).</p>
        </div>`;
    }

    const trs = rows
      .map(([name, streak]) => {
        const latest = latestIndustries.find((r) => r.name === name);
        return `
        <tr>
          <td class="name">${name}</td>
          <td class="num">${streak}회 연속</td>
          <td class="num ${deltaClass(latest.change_pct)}">${fmtPct(latest.change_pct)}</td>
        </tr>`;
      })
      .join("");

    return `
      <div class="card">
        <h2>연속 상위권 업종 <span class="hint">최근 스냅샷 기준 2회 이상 연속 TOP10</span></h2>
        <table>
          <thead><tr><th>업종</th><th>연속 횟수</th><th>최근 등락률</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  function kstDate(iso) {
    const d = new Date(new Date(iso).getTime() + 9 * 3600 * 1000);
    return d.toISOString().slice(0, 10);
  }

  function findMatchingEntry(otherHistory, entry) {
    // sector_history와 presurge/shortsqueeze_history는 같은 워크플로 실행에서
    // 각각 독립적으로 now()를 찍기 때문에 timestamp가 정확히 일치하지 않는다.
    // label + KST 날짜로 매칭.
    return otherHistory.find(
      (p) => p.label === entry.label && kstDate(p.timestamp) === kstDate(entry.timestamp)
    );
  }

  function presurgeTable(candidates) {
    if (!candidates || candidates.length === 0) {
      return `
        <div class="card">
          <h2>급등 전 후보 <span class="hint">거래량 몰림(relvol≥2x) + 등락률 -3~+6%, ETF 제외</span></h2>
          <p class="empty">이번 스냅샷엔 조건에 맞는 종목이 없었습니다.</p>
        </div>`;
    }
    const trs = candidates
      .slice(0, 15)
      .map(
        (c) => `
      <tr>
        <td class="name">${c.ticker} <span class="hint">${c.company}</span></td>
        <td class="num ${deltaClass(c.change_pct)}">${fmtPct(c.change_pct)}</td>
        <td class="num">${c.rel_volume.toFixed(2)}x</td>
        <td class="num">$${c.price.toFixed(2)}</td>
      </tr>`
      )
      .join("");
    return `
      <div class="card">
        <h2>급등 전 후보 <span class="hint">거래량 몰림(relvol≥2x) + 등락률 -3~+6%, ETF 제외, relvol 내림차순</span></h2>
        <table>
          <thead><tr><th>종목</th><th>등락률</th><th>상대거래량</th><th>현재가</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  function shortsqueezeTable(candidates) {
    if (!candidates || candidates.length === 0) {
      return `
        <div class="card">
          <h2>급등 전 숏스퀴즈 후보 <span class="hint">공매도비중≥20% + 오늘 거래량 몰림(relvol≥1.5x) + 아직 안 터짐(-3~+6%)</span></h2>
          <p class="empty">이번 스냅샷엔 조건에 맞는 종목이 없었습니다.</p>
        </div>`;
    }
    const trs = candidates
      .slice(0, 15)
      .map(
        (c) => `
      <tr>
        <td class="name">${c.ticker} <span class="hint">${c.company}</span></td>
        <td class="num ${deltaClass(c.change_pct)}">${fmtPct(c.change_pct)}</td>
        <td class="num">${c.rel_volume.toFixed(2)}x</td>
        <td class="num">${c.short_float_pct.toFixed(1)}%</td>
        <td class="num">${c.short_ratio_days.toFixed(1)}일</td>
        <td class="num">$${c.price.toFixed(2)}</td>
      </tr>`
      )
      .join("");
    return `
      <div class="card">
        <h2>급등 전 숏스퀴즈 후보 <span class="hint">공매도비중≥20% + relvol≥1.5x + 등락률 -3~+6%, 스퀴즈점수 내림차순, ETF 제외</span></h2>
        <table>
          <thead><tr><th>종목</th><th>등락률</th><th>상대거래량</th><th>공매도비중</th><th>커버일수</th><th>현재가</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  function statTile(label, name, deltaPct, sub) {
    return `
      <div class="stat-tile">
        <div class="label">${label}</div>
        <div class="stat-main">
          <span class="stat-name">${name}</span>
          <span class="stat-delta ${deltaClass(deltaPct)}">${fmtPct(deltaPct)}</span>
        </div>
        ${sub ? `<div class="sub">${sub}</div>` : ""}
      </div>`;
  }

  function statTiles(top10, bottom5, presurgeEntry, squeezeEntry) {
    const tiles = [];
    const strongest = top10[0];
    const weakest = bottom5[0];
    if (strongest) {
      tiles.push(statTile("가장 강한 업종", strongest.name, strongest.change_pct));
    }
    if (weakest) {
      tiles.push(statTile("가장 약한 업종", weakest.name, weakest.change_pct));
    }
    const topCandidate = presurgeEntry && presurgeEntry.candidates[0];
    if (topCandidate) {
      tiles.push(
        statTile(
          "급등 전 후보 1위",
          topCandidate.ticker,
          topCandidate.change_pct,
          `relvol ${topCandidate.rel_volume.toFixed(2)}x · ${topCandidate.company}`
        )
      );
    }
    const topSqueeze = squeezeEntry && squeezeEntry.candidates[0];
    if (topSqueeze) {
      tiles.push(
        statTile(
          "급등 전 숏스퀴즈 후보 1위",
          topSqueeze.ticker,
          topSqueeze.change_pct,
          `relvol ${topSqueeze.rel_volume.toFixed(2)}x · 공매도 ${topSqueeze.short_float_pct.toFixed(1)}% · 커버 ${topSqueeze.short_ratio_days.toFixed(1)}일`
        )
      );
    }
    if (tiles.length === 0) return "";
    return `<div class="stat-grid">${tiles.join("")}</div>`;
  }

  function render(history, presurgeHistory, squeezeHistory, index) {
    const content = document.getElementById("content");
    const entry = history[index];
    const sorted = [...entry.industries].sort((a, b) => b.change_pct - a.change_pct);
    const top10 = sorted.slice(0, 10);
    const bottom5 = sorted.slice(-5).reverse();
    const presurgeEntry = findMatchingEntry(presurgeHistory, entry);
    const squeezeEntry = findMatchingEntry(squeezeHistory, entry);

    document.getElementById("updated-label").textContent =
      `${fmtTimestamp(entry.timestamp)} · ${LABEL_KR[entry.label] || entry.label}`;

    content.innerHTML =
      statTiles(top10, bottom5, presurgeEntry, squeezeEntry) +
      `<div class="grid-2">
        ${presurgeTable(presurgeEntry ? presurgeEntry.candidates : null)}
        ${shortsqueezeTable(squeezeEntry ? squeezeEntry.candidates : null)}
      </div>` +
      `<div class="grid-2">
        ${rankTable(top10, "강한 업종 TOP 10", "등락률 내림차순")}
        ${rankTable(bottom5, "약한 업종 BOTTOM 5", "등락률 오름차순")}
      </div>` +
      streakTable(history.slice(0, index + 1), entry.industries);
  }

  async function main() {
    const content = document.getElementById("content");
    let history;
    try {
      const res = await fetch(`data/sector_history.json?_=${Date.now()}`);
      history = await res.json();
    } catch (e) {
      content.innerHTML = `<p class="empty">데이터를 불러오지 못했습니다: ${e}</p>`;
      return;
    }

    if (!history || history.length === 0) {
      content.innerHTML = `<p class="empty">아직 수집된 데이터가 없습니다. 첫 자동 수집을 기다려주세요.</p>`;
      return;
    }

    let presurgeHistory = [];
    try {
      const res = await fetch(`data/presurge_history.json?_=${Date.now()}`);
      presurgeHistory = await res.json();
    } catch (e) {
      // 급등 전 후보 데이터는 부가 기능이라, 못 불러와도 업종 대시보드는 정상 표시.
      console.warn("presurge_history 로드 실패:", e);
    }

    let squeezeHistory = [];
    try {
      const res = await fetch(`data/shortsqueeze_history.json?_=${Date.now()}`);
      squeezeHistory = await res.json();
    } catch (e) {
      console.warn("shortsqueeze_history 로드 실패:", e);
    }

    const picker = document.getElementById("snapshot-picker");
    history.forEach((entry, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${fmtTimestamp(entry.timestamp)} · ${LABEL_KR[entry.label] || entry.label}`;
      picker.appendChild(opt);
    });
    picker.value = history.length - 1;
    picker.addEventListener("change", () =>
      render(history, presurgeHistory, squeezeHistory, Number(picker.value))
    );

    render(history, presurgeHistory, squeezeHistory, history.length - 1);
  }

  main();
</script>
