  [data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;

<script>
  const LABEL_KR = { market_open: "미국 장 시작", midnight_kst: "한국시간 자정", manual: "수동 실행" };

  function fmtPct(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return "-";
    const sign = v > 0 ? "+" : "";
    return `${sign}${v.toFixed(2)}%`;
  }

  function deltaClass(v) {
    if (v > 0) return "delta-up";
    if (v < 0) return "delta-down";
    return "";
  }

  function fmtVolRatio(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return "-";
    return `${v.toFixed(2)}x`;
  }

  function fmtMarketCap(v) {
    if (!v) return "-";
    return `${(v / 1e9).toLocaleString(undefined, { maximumFractionDigits: 0 })}B`;
  }

  function fmtTimestamp(iso) {
    const d = new Date(iso);
    return d.toLocaleString("ko-KR", {
      timeZone: "Asia/Seoul",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
    }) + " KST";
  }

  function rankTable(rows, title, hint) {
    const trs = rows
      .map(
        (r) => `
      <tr>
        <td class="name">${r.name}</td>
        <td class="num ${deltaClass(r.change_pct)}">${fmtPct(r.change_pct)}</td>
        <td class="num">${fmtVolRatio(r.volume_ratio)}</td>
        <td class="num">${fmtMarketCap(r.market_cap)}</td>
        <td class="num">${r.stocks ?? "-"}</td>
      </tr>`
      )
      .join("");
    return `
      <div class="card">
        <h2>${title} <span class="hint">${hint}</span></h2>
        <table>
          <thead>
            <tr><th>업종</th><th>등락률</th><th>거래량비율</th><th>시총</th><th>종목수</th></tr>
          </thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  function krRankTable(rows, title, hint) {
    // 네이버 업종별 시세는 거래량비율/시총을 안 주는 대신 상승/보합/하락 종목수를 준다.
    const trs = rows
      .map(
        (r) => `
      <tr>
        <td class="name">${r.name}</td>
        <td class="num ${deltaClass(r.change_pct)}">${fmtPct(r.change_pct)}</td>
        <td class="num">${r.up_ratio_pct.toFixed(1)}%</td>
        <td class="num">${r.up}/${r.flat}/${r.down}</td>
        <td class="num">${r.total ?? "-"}</td>
      </tr>`
      )
      .join("");
    return `
      <div class="card">
        <h2>${title} <span class="hint">${hint}</span></h2>
        <table>
          <thead>
            <tr><th>업종</th><th>등락률</th><th>상승비율</th><th>상승/보합/하락</th><th>종목수</th></tr>
          </thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  function streakTable(history, latestIndustries) {
    // 최신 스냅샷 TOP10에 있는 업종이, 그 직전 스냅샷들에서도 연속으로 TOP10이었는지 센다.
    const top10Names = new Set(
      [...latestIndustries].sort((a, b) => b.change_pct - a.change_pct).slice(0, 10).map((r) => r.name)
    );
    const streaks = {};
    for (const name of top10Names) streaks[name] = 0;

    for (let i = history.length - 1; i >= 0; i--) {
      const top10 = new Set(
        [...history[i].industries].sort((a, b) => b.change_pct - a.change_pct).slice(0, 10).map((r) => r.name)
      );
      let anyContinuing = false;
      for (const name of top10Names) {
        if (streaks[name] === history.length - 1 - i && top10.has(name)) {
          streaks[name]++;
          anyContinuing = true;
        }
      }
      if (!anyContinuing) break;
    }

    const rows = Object.entries(streaks)
      .filter(([, streak]) => streak >= 2)
      .sort((a, b) => b[1] - a[1]);

    if (rows.length === 0) {
      return `
        <div class="card">
          <h2>연속 상위권 업종 <span class="hint">최근 스냅샷 기준 2회 이상 연속 TOP10</span></h2>
          <p class="empty">아직 연속으로 강세인 업종이 없습니다 (히스토리가 더 쌓이면 나타납니다).</p>
        </div>`;
    }

    const trs = rows
      .map(([name, streak]) => {
        const latest = latestIndustries.find((r) => r.name === name);
        return `
        <tr>
          <td class="name">${name}</td>
          <td class="num">${streak}회 연속</td>
          <td class="num ${deltaClass(latest.change_pct)}">${fmtPct(latest.change_pct)}</td>
        </tr>`;
      })
      .join("");

    return `
      <div class="card">
        <h2>연속 상위권 업종 <span class="hint">최근 스냅샷 기준 2회 이상 연속 TOP10</span></h2>
        <table>
          <thead><tr><th>업종</th><th>연속 횟수</th><th>최근 등락률</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  function kstDate(iso) {
    const d = new Date(new Date(iso).getTime() + 9 * 3600 * 1000);
    return d.toISOString().slice(0, 10);
  }

  function findMatchingEntry(otherHistory, entry) {
    // sector_history와 presurge/shortsqueeze_history는 같은 워크플로 실행에서
    // 각각 독립적으로 now()를 찍기 때문에 timestamp가 정확히 일치하지 않는다.
    // label + KST 날짜로 매칭.
    return otherHistory.find(
      (p) => p.label === entry.label && kstDate(p.timestamp) === kstDate(entry.timestamp)
    );
  }

  function presurgeTable(candidates) {
    if (!candidates || candidates.length === 0) {
      return `
        <div class="card">
          <h2>급등 전 후보 <span class="hint">거래량 몰림(relvol≥2x) + 등락률 -3~+6%, ETF 제외</span></h2>
          <p class="empty">이번 스냅샷엔 조건에 맞는 종목이 없었습니다.</p>
        </div>`;
    }
    const trs = candidates
      .slice(0, 15)
      .map(
        (c) => `
      <tr>
        <td class="name">${c.ticker} <span class="hint">${c.company}</span></td>
        <td class="num ${deltaClass(c.change_pct)}">${fmtPct(c.change_pct)}</td>
        <td class="num">${c.rel_volume.toFixed(2)}x</td>
        <td class="num">$${c.price.toFixed(2)}</td>
      </tr>`
      )
      .join("");
    return `
      <div class="card">
        <h2>급등 전 후보 <span class="hint">거래량 몰림(relvol≥2x) + 등락률 -3~+6%, ETF 제외, relvol 내림차순</span></h2>
        <table>
          <thead><tr><th>종목</th><th>등락률</th><th>상대거래량</th><th>현재가</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  function shortsqueezeTable(candidates) {
    if (!candidates || candidates.length === 0) {
      return `
        <div class="card">
          <h2>급등 전 숏스퀴즈 후보 <span class="hint">공매도비중≥20% + 오늘 거래량 몰림(relvol≥1.5x) + 아직 안 터짐(-3~+6%)</span></h2>
          <p class="empty">이번 스냅샷엔 조건에 맞는 종목이 없었습니다.</p>
        </div>`;
    }
    const trs = candidates
      .slice(0, 15)
      .map(
        (c) => `
      <tr>
        <td class="name">${c.ticker} <span class="hint">${c.company}</span></td>
        <td class="num ${deltaClass(c.change_pct)}">${fmtPct(c.change_pct)}</td>
        <td class="num">${c.rel_volume.toFixed(2)}x</td>
        <td class="num">${c.short_float_pct.toFixed(1)}%</td>
        <td class="num">${c.short_ratio_days.toFixed(1)}일</td>
        <td class="num">$${c.price.toFixed(2)}</td>
      </tr>`
      )
      .join("");
    return `
      <div class="card">
        <h2>급등 전 숏스퀴즈 후보 <span class="hint">공매도비중≥20% + relvol≥1.5x + 등락률 -3~+6%, 스퀴즈점수 내림차순, ETF 제외</span></h2>
        <table>
          <thead><tr><th>종목</th><th>등락률</th><th>상대거래량</th><th>공매도비중</th><th>커버일수</th><th>현재가</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  // --- 업종 트리맵 (마인드맵) ---------------------------------------------

  function squarify(items, x, y, width, height) {
    // Bruls/Huizing/van Wijk squarified treemap. items: [{value, ...}], value 합 = width*height.
    const results = [];

    function worstRatio(row, length) {
      const sum = row.reduce((a, r) => a + r.value, 0);
      let max = -Infinity;
      let min = Infinity;
      for (const r of row) {
        if (r.value > max) max = r.value;
        if (r.value < min) min = r.value;
      }
      const s2 = sum * sum;
      const l2 = length * length;
      return Math.max((l2 * max) / s2, s2 / (l2 * min));
    }

    function layoutRow(row, rx, ry, rw, rh) {
      const sum = row.reduce((a, r) => a + r.value, 0);
      if (rw >= rh) {
        const colWidth = rh > 0 ? sum / rh : 0;
        let curY = ry;
        for (const item of row) {
          const h = sum > 0 ? (item.value / sum) * rh : 0;
          results.push({ item: item.item, x: rx, y: curY, width: colWidth, height: h });
          curY += h;
        }
        return { x: rx + colWidth, y: ry, width: rw - colWidth, height: rh };
      }
      const rowHeight = rw > 0 ? sum / rw : 0;
      let curX = rx;
      for (const item of row) {
        const w = sum > 0 ? (item.value / sum) * rw : 0;
        results.push({ item: item.item, x: curX, y: ry, width: w, height: rowHeight });
        curX += w;
      }
      return { x: rx, y: ry + rowHeight, width: rw, height: rh - rowHeight };
    }

    function recurse(items2, rx, ry, rw, rh) {
      if (items2.length === 0) return;
      if (items2.length === 1) {
        layoutRow(items2, rx, ry, rw, rh);
        return;
      }
      const length = Math.min(rw, rh);
      let row = [items2[0]];
      let i = 1;
      while (i < items2.length) {
        const testRow = row.concat([items2[i]]);
        if (worstRatio(testRow, length) <= worstRatio(row, length)) {
          row = testRow;
          i++;
        } else {
          break;
        }
      }
      const rest = items2.slice(i);
      const remainder = layoutRow(row, rx, ry, rw, rh);
      recurse(rest, remainder.x, remainder.y, remainder.width, remainder.height);
    }

    recurse(
      items.filter((i) => i.value > 0),
      x,
      y,
      width,
      height
    );
    return results;
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.replace("#", ""), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function lerpColor(hexA, hexB, t) {
    const a = hexToRgb(hexA);
    const b = hexToRgb(hexB);
    const rgb = a.map((v, i) => Math.round(v + (b[i] - v) * t));
    return `rgb(${rgb.join(",")})`;
  }

  function treemapColor(changePct, maxAbs) {
    // 사용자 요청: 강세(양수)=빨강, 약세(음수)=초록. 0%는 중립 회색.
    const strong = getComputedStyle(document.documentElement).getPropertyValue("--treemap-strong").trim();
    const weak = getComputedStyle(document.documentElement).getPropertyValue("--treemap-weak").trim();
    const neutral = getComputedStyle(document.documentElement).getPropertyValue("--treemap-neutral").trim();
    const t = maxAbs > 0 ? Math.min(Math.abs(changePct) / maxAbs, 1) : 0;
    return changePct >= 0 ? lerpColor(neutral, strong, t) : lerpColor(neutral, weak, t);
  }

  function treemapCard(industries, opts = {}) {
    const containerId = opts.containerId || "sector-treemap";
    const sizeField = opts.sizeField || "market_cap";
    const sizeLabel = opts.sizeLabel || "시가총액";
    const maxAbs = Math.max(...industries.map((i) => Math.abs(i.change_pct)), 1);
    // 실제 렌더 후(DOM에 붙은 뒤) 폭을 재서 채워 넣는다 — innerHTML 삽입 시점엔 레이아웃 폭을 모름.
    window.__renderTreemap = () => {
      const el = document.getElementById(containerId);
      if (!el) return;
      const width = el.clientWidth;
      const height = el.clientHeight;
      const items = industries
        .filter((i) => i[sizeField])
        .map((i) => ({ value: i[sizeField], item: i }));
      const total = items.reduce((s, i) => s + i.value, 0);
      const scale = total > 0 ? (width * height) / total : 0;
      const scaled = items.map((i) => ({ value: i.value * scale, item: i.item }));
      scaled.sort((a, b) => b.value - a.value);
      const rects = squarify(scaled, 0, 0, width, height);
      el.innerHTML = rects
        .map((r) => {
          const ind = r.item;
          const showLabel = r.width >= 46 && r.height >= 26;
          const showPct = r.width >= 46 && r.height >= 40;
          return `
          <div class="treemap-cell" title="${ind.name}: ${fmtPct(ind.change_pct)}"
               style="left:${r.x}px; top:${r.y}px; width:${r.width}px; height:${r.height}px; background:${treemapColor(ind.change_pct, maxAbs)};">
            ${showLabel ? `<span class="tm-name">${ind.name}</span>` : ""}
            ${showPct ? `<span class="tm-pct">${fmtPct(ind.change_pct)}</span>` : ""}
          </div>`;
        })
        .join("");
    };
    return `
      <div class="card">
        <h2>업종 트리맵 <span class="hint">사각형 크기=${sizeLabel}, 색상=등락률 (강세 빨강 · 약세 초록)</span></h2>
        <div class="treemap-wrap" id="${containerId}"></div>
        <div class="treemap-legend">
          <span>약세</span>
          <div class="bar"></div>
          <span>강세</span>
        </div>
      </div>`;
  }

  function statTile(label, name, deltaPct, sub) {
    return `
      <div class="stat-tile">
        <div class="label">${label}</div>
        <div class="stat-main">
          <span class="stat-name">${name}</span>
          <span class="stat-delta ${deltaClass(deltaPct)}">${fmtPct(deltaPct)}</span>
        </div>
        ${sub ? `<div class="sub">${sub}</div>` : ""}
      </div>`;
  }

  function statTiles(top10, bottom5, presurgeEntry, squeezeEntry) {
    const tiles = [];
    const strongest = top10[0];
    const weakest = bottom5[0];
    if (strongest) {
      tiles.push(statTile("가장 강한 업종", strongest.name, strongest.change_pct));
    }
    if (weakest) {
      tiles.push(statTile("가장 약한 업종", weakest.name, weakest.change_pct));
    }
    const topCandidate = presurgeEntry && presurgeEntry.candidates[0];
    if (topCandidate) {
      tiles.push(
        statTile(
          "급등 전 후보 1위",
          topCandidate.ticker,
          topCandidate.change_pct,
          `relvol ${topCandidate.rel_volume.toFixed(2)}x · ${topCandidate.company}`
        )
      );
    }
    const topSqueeze = squeezeEntry && squeezeEntry.candidates[0];
    if (topSqueeze) {
      tiles.push(
        statTile(
          "급등 전 숏스퀴즈 후보 1위",
          topSqueeze.ticker,
          topSqueeze.change_pct,
          `relvol ${topSqueeze.rel_volume.toFixed(2)}x · 공매도 ${topSqueeze.short_float_pct.toFixed(1)}% · 커버 ${topSqueeze.short_ratio_days.toFixed(1)}일`
        )
      );
    }
    if (tiles.length === 0) return "";
    return `<div class="stat-grid">${tiles.join("")}</div>`;
  }

  function renderOverseas(index) {
    const content = document.getElementById("content");
    const { history, presurgeHistory, squeezeHistory } = DATA.overseas;
    const entry = history[index];
    const sorted = [...entry.industries].sort((a, b) => b.change_pct - a.change_pct);
    const top10 = sorted.slice(0, 10);
    const bottom5 = sorted.slice(-5).reverse();
    const presurgeEntry = findMatchingEntry(presurgeHistory, entry);
    const squeezeEntry = findMatchingEntry(squeezeHistory, entry);

    document.getElementById("updated-label").textContent =
      `${fmtTimestamp(entry.timestamp)} · ${LABEL_KR[entry.label] || entry.label}`;

    content.innerHTML =
      statTiles(top10, bottom5, presurgeEntry, squeezeEntry) +
      treemapCard(entry.industries, { sizeField: "market_cap", sizeLabel: "시가총액" }) +
      `<div class="grid-2">
        ${presurgeTable(presurgeEntry ? presurgeEntry.candidates : null)}
        ${shortsqueezeTable(squeezeEntry ? squeezeEntry.candidates : null)}
      </div>` +
      `<div class="grid-2">
        ${rankTable(top10, "강한 업종 TOP 10", "등락률 내림차순")}
        ${rankTable(bottom5, "약한 업종 BOTTOM 5", "등락률 오름차순")}
      </div>` +
      streakTable(history.slice(0, index + 1), entry.industries);

    if (window.__renderTreemap) window.__renderTreemap();
  }

  function renderDomestic(index) {
    const content = document.getElementById("content");
    const { history } = DATA.domestic;
    const entry = history[index];
    const sorted = [...entry.industries].sort((a, b) => b.change_pct - a.change_pct);
    const top10 = sorted.slice(0, 10);
    const bottom5 = sorted.slice(-5).reverse();

    document.getElementById("updated-label").textContent =
      `${fmtTimestamp(entry.timestamp)} · ${LABEL_KR[entry.label] || entry.label}`;

    const tiles = [];
    if (top10[0]) tiles.push(statTile("가장 강한 업종", top10[0].name, top10[0].change_pct));
    if (bottom5[0]) tiles.push(statTile("가장 약한 업종", bottom5[0].name, bottom5[0].change_pct));

    content.innerHTML =
      (tiles.length ? `<div class="stat-grid">${tiles.join("")}</div>` : "") +
      treemapCard(entry.industries, {
        containerId: "sector-treemap-kr",
        sizeField: "total",
        sizeLabel: "업종 소속 종목수",
      }) +
      `<div class="grid-2">
        ${krRankTable(top10, "강한 업종 TOP 10", "등락률 내림차순")}
        ${krRankTable(bottom5, "약한 업종 BOTTOM 5", "등락률 오름차순")}
      </div>` +
      streakTable(history.slice(0, index + 1), entry.industries);

    if (window.__renderTreemap) window.__renderTreemap();
  }

  function populatePicker(history) {
    const picker = document.getElementById("snapshot-picker");
    picker.innerHTML = "";
    history.forEach((entry, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${fmtTimestamp(entry.timestamp)} · ${LABEL_KR[entry.label] || entry.label}`;
      picker.appendChild(opt);
    });
    picker.value = history.length - 1;
  }

  function renderCurrent() {
    const picker = document.getElementById("snapshot-picker");
    const index = Number(picker.value);
    if (CURRENT_MARKET === "overseas") renderOverseas(index);
    else renderDomestic(index);
  }

  const DATA_SOURCE_LINKS = {
    overseas: `<a href="https://finviz.com/groups.ashx?g=industry&v=152" target="_blank" rel="noopener">Finviz</a>`,
    domestic: `<a href="https://finance.naver.com/sise/sise_group.naver?type=upjong" target="_blank" rel="noopener">네이버 증권</a>`,
  };

  function switchMarket(market) {
    document.getElementById("data-source-links").innerHTML = DATA_SOURCE_LINKS[market];
    if (!DATA[market] || !DATA[market].history || DATA[market].history.length === 0) {
      document.getElementById("content").innerHTML =
        `<p class="empty">${market === "domestic" ? "국내" : "해외"} 데이터가 아직 없습니다.</p>`;
      document.getElementById("snapshot-picker").innerHTML = "";
      document.getElementById("updated-label").textContent = "";
      CURRENT_MARKET = market;
      document.querySelectorAll(".market-btn").forEach((b) => b.classList.toggle("active", b.dataset.market === market));
      return;
    }
    CURRENT_MARKET = market;
    document.querySelectorAll(".market-btn").forEach((b) => b.classList.toggle("active", b.dataset.market === market));
    populatePicker(DATA[market].history);
    renderCurrent();
  }

  let CURRENT_MARKET = "overseas";
  const DATA = { overseas: { history: [] }, domestic: { history: [] } };

  async function fetchJson(path) {
    try {
      const res = await fetch(`${path}?_=${Date.now()}`);
      return await res.json();
    } catch (e) {
      console.warn(`${path} 로드 실패:`, e);
      return [];
    }
  }

  async function main() {
    const [sectorHistory, presurgeHistory, squeezeHistory, krSectorHistory] = await Promise.all([
      fetchJson("data/sector_history.json"),
      fetchJson("data/presurge_history.json"),
      fetchJson("data/shortsqueeze_history.json"),
      fetchJson("data/kr_sector_history.json"),
    ]);

    DATA.overseas = { history: sectorHistory || [], presurgeHistory: presurgeHistory || [], squeezeHistory: squeezeHistory || [] };
    DATA.domestic = { history: krSectorHistory || [] };

    if (DATA.overseas.history.length === 0 && DATA.domestic.history.length === 0) {
      document.getElementById("content").innerHTML =
        `<p class="empty">아직 수집된 데이터가 없습니다. 첫 자동 수집을 기다려주세요.</p>`;
      return;
    }

    document.querySelectorAll(".market-btn").forEach((btn) => {
      btn.addEventListener("click", () => switchMarket(btn.dataset.market));
    });

    const picker = document.getElementById("snapshot-picker");
    picker.addEventListener("change", () => renderCurrent());

    // 해외 데이터가 없으면(있을 일은 거의 없지만) 국내로 기본 진입.
    switchMarket(DATA.overseas.history.length > 0 ? "overseas" : "domestic");
  }

  main();
</script>
